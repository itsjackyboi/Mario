<script>
/* Keep a copy of the game on the device. Served from a file:// path there is
 * no worker to register and nothing to keep — the files are already local —
 * so this quietly does nothing, which is also what an old browser does.
 *
 * THE REST OF THIS IS THE ESCAPE HATCH, and it is here because a service
 * worker that caches the page can strand somebody on an old build with no way
 * out but deleting the site:
 *
 *   updateViaCache: 'none' — check sw.js against the server, not against the
 *     browser's own HTTP cache. The worker script is the only thing that can
 *     replace a bad worker, so it is the one file that must never be answered
 *     from a cache.
 *   reg.update() — ask on every load rather than waiting for whenever the
 *     browser feels like checking.
 *   controllerchange — a new worker has taken over a page that was already
 *     drawn by the old one, so what is on screen is still the old build.
 *     Reload it. Only when there was an old worker to replace, though: the
 *     first visit of all fires this too, from clients.claim(), and that page
 *     is already the new one.
 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  var hadWorker = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=2.2.4', { updateViaCache: 'none' })
      .then(function (reg) { reg.update(); })['catch'](function () {});
  });
  var swept = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swept || !hadWorker) return;
    swept = true;
    try {
      // A timestamp rather than a flag: two reloads inside ten seconds is a
      // loop and gets stopped, but an update an hour into a session still
      // gets its reload.
      var last = +(sessionStorage.getItem('pl-sw-reload') || 0);
      if (Date.now() - last < 10000) return;
      sessionStorage.setItem('pl-sw-reload', String(Date.now()));
    } catch (err) { /* private browsing: one reload is still better than none */ }
    location.reload();
  });
}
</script>
